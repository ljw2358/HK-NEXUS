<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="doc-title">HK NEXUS 시스템 대시보드</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #111e38;
            --card-border: #1d2d50;
            --text-color: #ffffff;
            --text-secondary: #8a99ad;
            --accent-blue: #00d2ff;
            --accent-green: #00ff88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Select Box */
        .lang-select, .user-menu {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .lang-select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 20px;
        }

        /* Radar Card */
        .radar-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            position: relative;
        }

        .radar-title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .radar-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 1px solid rgba(0, 210, 255, 0.4);
            background: radial-gradient(circle, rgba(0,210,255,0.05) 0%, rgba(0,0,0,0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: 20px;
        }

        .radar-center-dot {
            width: 6px;
            height: 6px;
            background-color: #ff3e3e;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3e3e;
        }

        .radar-footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Status Cards Stack */
        .status-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .status-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 110px;
        }

        .status-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .status-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .status-value.active {
            color: var(--accent-green);
        }
    </style>
</head>

        <h1 id="title">HK NEXUS 시스템 대시보드</h1>
        <div class="header-controls">
            <!-- 요청하신 16개 언어 셀렉트 박스 -->
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">

                <option value="en">English (US)</option>
                <option value="zh">中文 (CN)</option>
                <option value="ar">العربية (AR)</option>
                <option value="hi">हिन्दी (IN - 인도어)</option>
                <option value="es">Español (ES)</option>
                <option value="pt_br">Português (BR - 브라질어)</option>
                <option value="uk">Українська (UA - 우크라이나어)</option>
                <option value="ja">日本語 (JP)</option>
                <option value="ru">Русский (RU)</option>
                <option value="vi">Tiếng Việt (VN - 베트남어)</option>

                <option value="ar_ps">العربية (PS - 팔레스타인어)</option>
                <option value="de">Deutsch (DE)</option>
                <option value="it">Italiano (IT)</option>
                <option value="fr">Français (FR)</option>
            </select>
            <div class="user-menu" id="user-menu">관리자 (Admin)</div>
        </div>
    </header>

    <!-- 대시보드 메인 콘텐츠 -->
    <main class="dashboard-grid">
        
        <!-- 레이더 스코프 카드 -->
        <section class="card radar-card">
            <div class="radar-title" id="radar-title">타겟 레이더 스코프</div>
            <div class="radar-circle">
                <div class="radar-center-dot"></div>
            </div>
            <div class="radar-footer" id="radar-footer">추적 ID: HK-NEXUS-01</div>
        </section>

        <!-- 시스템 정보 카드 목록 -->
        <div class="status-stack">
            <section class="status-card">
                <div class="status-label" id="lbl-status">시스템 상태</div>
                <div class="status-value active" id="val-status">ACTIVE</div>
            </section>

            <section class="status-card">
                <div class="status-label" id="lbl-speed">운행 속도</div>
                <div class="status-value">1.2 m/s</div>
            </section>

            <section class="status-card">
                <div class="status-label" id="lbl-battery">배터리</div>
                <div class="status-value">92 %</div>
            </section>
        </div>

    </main>
