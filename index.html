<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HK Glass OS | Global Control</title>
  <style>
    body { background: #000; color: #38bdf8; margin: 0; font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .hud-layer { flex: 1; padding: 20px; position: relative; background: radial-gradient(circle at center, rgba(0, 50, 80, 0.2), #000); }
    
    .status-bar { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #1e3a8a; }
    
    .lang-container { position: absolute; top: 60px; right: 20px; }
    select { background: #000; color: #38bdf8; border: 1px solid #38bdf8; padding: 5px; cursor: pointer; }

    .control-center { background: rgba(15, 23, 42, 0.8); padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; border-top: 2px solid #1e3a8a; }
    .btn { border: 1px solid #38bdf8; color: #38bdf8; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="hud-layer">
  <div class="status-bar">
    <span id="label-title">HK-GLASS OS</span>
    <span id="label-link">SAT: ACTIVE</span>
  </div>

  <div class="lang-container">
    <select onchange="changeLang(this.value)">
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ar">العربية (Arabic)</option>
      <option value="hi">हिन्दी (Hindi)</option>
      <option value="es">Español</option>
      <option value="pt">Português (Brasil)</option>
      <option value="uk">Українська</option>
      <option value="ja">日本語</option>
      <option value="ru">Русский</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ภาษาไทย</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="ps">فلسطين (Palestinian)</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="fr">Français</option>
    </select>
  </div>

  <div style="margin-top: 100px;">
    <h2 id="monitor-title">SYSTEM MONITORING</h2>
    <p>> <span id="robot-text">Robot Status:</span> <span id="robot-status">Online</span></p>
    <p>> <span id="uam-text">UAM Status:</span> <span id="uam-status">Standby</span></p>
  </div>
</div>

<div class="control-center">
  <div class="btn" id="btn-nav">NAV</div>
  <div class="btn" id="btn-robot">ROBOT</div>
  <div class="btn" id="btn-call">CALL</div>
  <div class="btn" id="btn-off">OFF</div>
</div>

<script>
  const i18n = {
    en: { title: "HK-GLASS OS", link: "SAT: ACTIVE", monitor: "SYSTEM MONITORING", robot: "Robot Status:", uam: "UAM Status:", nav: "NAV", rbt: "ROBOT", call: "CALL", off: "OFF" },
    zh: { title: "HK-GLASS OS", link: "卫星: 已激活", monitor: "系统监控", robot: "机器人状态:", uam: "UAM 状态:", nav: "导航", rbt: "机器人", call: "呼叫", off: "关机" },
    ar: { title: "HK-GLASS OS", link: "القمر الصناعي: نشط", monitor: "مراقبة النظام", robot: "حالة الروبوت:", uam: "حالة UAM:", nav: "الملاحة", rbt: "روبوت", call: "اتصال", off: "إيقاف" },
    hi: { title: "HK-GLASS OS", link: "सैट: सक्रिय", monitor: "सिस्टम मॉनिटरिंग", robot: "रोबोट स्थिति:", uam: "UAM स्थिति:", nav: "नेविगेशन", rbt: "रोबोट", call: "कॉल", off: "बंद" },
    es: { title: "HK-GLASS OS", link: "SAT: ACTIVO", monitor: "MONITOREO DEL SISTEMA", robot: "Estado del Robot:", uam: "Estado UAM:", nav: "NAV", rbt: "ROBOT", call: "LLAMAR", off: "APAGAR" },
    pt: { title: "HK-GLASS OS", link: "SAT: ATIVO", monitor: "MONITORAMENTO DO SISTEMA", robot: "Status do Robô:", uam: "Status UAM:", nav: "NAVEGAR", rbt: "ROBÔ", call: "LIGAR", off: "DESLIGAR" },
    uk: { title: "HK-GLASS OS", link: "САТ: АКТИВНИЙ", monitor: "МОНІТОРИНГ СИСТЕМИ", robot: "Статус робота:", uam: "Статус UAM:", nav: "НАВ", rbt: "РОБОТ", call: "ВИКЛИК", off: "ВИМК" },
    ja: { title: "HK-GLASS OS", link: "衛星: 有効", monitor: "システム監視", robot: "ロボット状態:", uam: "UAM状態:", nav: "ナビ", rbt: "ロボット", call: "通話", off: "終了" },
    ru: { title: "HK-GLASS OS", link: "САТ: АКТИВЕН", monitor: "МОНИТОРИНГ СИСТЕМЫ", robot: "Статус робота:", uam: "Статус UAM:", nav: "НАВ", rbt: "РОБОТ", call: "ВЫЗОВ", off: "ВЫКЛ" },
    vi: { title: "HK-GLASS OS", link: "SAT: HOẠT ĐỘNG", monitor: "GIÁM SÁT HỆ THỐNG", robot: "Trạng thái Robot:", uam: "Trạng thái UAM:", nav: "ĐỊNH VỊ", rbt: "ROBOT", call: "GỌI", off: "TẮT" },
    th: { title: "HK-GLASS OS", link: "ดาวเทียม: ใช้งานอยู่", monitor: "การตรวจสอบระบบ", robot: "สถานะหุ่นยนต์:", uam: "สถานะ UAM:", nav: "นำทาง", rbt: "หุ่นยนต์", call: "โทร", off: "ปิด" },
    id: { title: "HK-GLASS OS", link: "SAT: AKTIF", monitor: "PEMANTAUAN SISTEM", robot: "Status Robot:", uam: "Status UAM:", nav: "NAVIGASI", rbt: "ROBOT", call: "PANGGIL", off: "MATIKAN" },
    ps: { title: "HK-GLASS OS", link: "السات: نشط", monitor: "د سیسټم څارنه", robot: "د روبوټ حالت:", uam: "د UAM حالت:", nav: "نویګیشن", rbt: "روبوټ", call: "کال", off: "بند" },
    de: { title: "HK-GLASS OS", link: "SAT: AKTIV", monitor: "SYSTEMÜBERWACHUNG", robot: "Roboter-Status:", uam: "UAM-Status:", nav: "NAV", rbt: "ROBOTER", call: "ANRUF", off: "AUS" },
    it: { title: "HK-GLASS OS", link: "SAT: ATTIVO", monitor: "MONITORAGGIO SISTEMA", robot: "Stato Robot:", uam: "Stato UAM:", nav: "NAV", rbt: "ROBOT", call: "CHIAMA", off: "SPENTO" },
    fr: { title: "HK-GLASS OS", link: "SAT: ACTIF", monitor: "SURVEILLANCE SYSTÈME", robot: "État Robot:", uam: "État UAM:", nav: "NAV", rbt: "ROBOT", call: "APPELER", off: "ÉTEINDRE" }
  };

  function changeLang(lang) {
    const d = i18n[lang];
    document.getElementById('label-title').innerText = d.title;
    document.getElementById('label-link').innerText = d.link;
    document.getElementById('monitor-title').innerText = d.monitor;
    document.getElementById('robot-text').innerText = d.robot;
    document.getElementById('uam-text').innerText = d.uam;
    document.getElementById('btn-nav').innerText = d.nav;
    document.getElementById('btn-robot').innerText = d.rbt;
    document.getElementById('btn-call').innerText = d.call;
    document.getElementById('btn-off').innerText = d.off;
  }
</script>
</body>
</html>
