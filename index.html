<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK-Nexus - 글로벌 공급망</title>
    <style>
        body {
            margin: 0;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #0d1117;
            color: #ffffff;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        /* 우측 상단 드롭다운 스타일 */
        .language-selector select {
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
        }
        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .hero p {
            color: #8b949e;
            font-size: 16px;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0 40px 60px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 300px;
        }
        .card h3 {
            margin-top: 0;
            font-size: 20px;
        }
        .card p {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">HK-Nexus</div>
        <!-- 우측 언어 선택 드롭다운 창 -->
        <div class="language-selector">
            <select id="languageSelect" onchange="changeLanguage(this.value)">
                <option value="ko" selected>한국어</option>
                <option value="en">English (영어)</option>
                <option value="zh">中文 (중국어)</option>
                <option value="ar">العربية (아랍어)</option>
                <option value="hi">हिन्दी (인도어)</option>
                <option value="es">Español (스페인어)</option>
                <option value="pt-br">Português (브라질어)</option>
                <option value="uk">Українська (우크라이나어)</option>
                <option value="ja">日本語 (일본어)</option>
                <option value="ru">Русский (러시아어)</option>
                <option value="vi">Tiếng Việt (베트남어)</option>
                <option value="th">ไทย (태국어)</option>
                <option value="id">Bahasa Indonesia (인도네시아어)</option>
                <option value="ps-pal">العربية - فلسطين (팔레스타인어)</option>
                <option value="en-ng">English - Nigeria (나이지리아어)</option>
            </select>
        </div>
    </header>

    <section class="hero">
        <h1>HK-Nexus 글로벌 공급망</h1>
        <p>전 세계를 연결하는 지능형 부품 소싱 및 공급 플랫폼입니다. 필요한 모든 부품을 가장 빠르고 안전하게 제공합니다.</p>
    </section>

    <section class="features">
        <div class="card">
            <h3>1. 글로벌 소싱 네트워크</h3>
            <p>전 세계 수만 개의 인증된 공급망과 인공지능이 최적의 유통까지 신속하게 찾아냅니다.</p>
        </div>
        <div class="card">
            <h3>2. AI 재고 최적화</h3>
            <p>인공지능 기반 수요 예측으로 불필요한 부품을 항상 최적의 수량으로 보유합니다.</p>
        </div>
        <div class="card">
            <h3>3. 초고속 익스프레스 배송</h3>
            <p>글로벌 물류 거점을 활용하여 주요 도시로 24시간 이내 배송을 목표로 합니다.</p>
        </div>
    </section>

    <script>
        function changeLanguage(lang) {
            console.log("Selected language: " + lang);
        }
    </script>

</body>
</html>
